<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport"
      content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">

<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">

<title>J PHOTO BOOTH</title>

<style>
:root {
  --bg: #101010;
  --panel: #222;
  --text: #fff;
  --muted: #aaa;
  --green: #00c853;
  --blue: #2196f3;
  --red: #ff5252;
  --gold: #ffd54f;
}

* {
  box-sizing: border-box;
}

html,
body {
  margin: 0;
  padding: 0;
  width: 100%;
  min-height: 100%;
  background: var(--bg);
  color: var(--text);
  font-family:
    -apple-system,
    BlinkMacSystemFont,
    "Segoe UI",
    sans-serif;
}

body {
  overflow-x: hidden;
}

.hidden {
  display: none !important;
}

.screen {
  min-height: 100svh;
  padding: 25px 16px 50px;
  display: flex;
  flex-direction: column;
  align-items: center;
}

h1 {
  font-size: clamp(30px, 7vw, 52px);
  margin: 15px 0;
  text-align: center;
}

h2 {
  margin: 10px 0 18px;
}

p {
  color: var(--muted);
  font-size: 18px;
  text-align: center;
}

button {
  border: 0;
  border-radius: 18px;
  padding: 17px 28px;
  margin: 8px;
  min-height: 56px;
  font-size: 20px;
  font-weight: 800;
  cursor: pointer;
  touch-action: manipulation;
}

button:disabled {
  opacity: .45;
  cursor: not-allowed;
}

.primary {
  background: var(--green);
  color: white;
}

.blue {
  background: var(--blue);
  color: white;
}

.danger {
  background: var(--red);
  color: white;
}

.dark {
  background: #333;
  color: white;
}

.gold {
  background: var(--gold);
  color: #111;
}

.logo {
  font-size: 72px;
  margin-top: 8vh;
}

.home-buttons {
  display: flex;
  flex-wrap: wrap;
  justify-content: center;
}

.info {
  width: min(92vw, 800px);
  margin-top: 25px;
  padding: 15px 18px;
  background: #191919;
  border: 1px solid #333;
  border-radius: 16px;
  color: #999;
  text-align: center;
  line-height: 1.6;
}

/* CAMERA */

.camera-wrap {
  position: relative;
  width: min(94vw, 850px);
}

#camera {
  display: block;
  width: 100%;
  max-height: 70svh;
  object-fit: cover;
  border-radius: 24px;
  background: #000;
  transform: scaleX(-1);
}

#countdown {
  position: fixed;
  inset: 0;
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: clamp(100px, 25vw, 190px);
  font-weight: 900;
  text-shadow: 0 4px 30px #000;
  pointer-events: none;
  z-index: 100;
}

.counter {
  font-size: 22px;
  margin: 18px;
  font-weight: 800;
}

/* REVIEW */

.photo-grid {
  width: min(94vw, 700px);
  display: grid;
  grid-template-columns: repeat(2, 1fr);
  gap: 12px;
}

.photo-grid img {
  display: block;
  width: 100%;
  border-radius: 14px;
  background: white;
}

/* FRAME SELECT */

.frame-grid {
  width: min(96vw, 1000px);
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: 18px;
  margin-top: 15px;
}

.frame-card {
  background: #222;
  border: 4px solid transparent;
  border-radius: 20px;
  padding: 10px;
  cursor: pointer;
  transition: .2s;
}

.frame-card:hover {
  transform: translateY(-3px);
}

.frame-card.selected {
  border-color: var(--green);
  box-shadow:
    0 0 0 3px rgba(0,200,83,.25),
    0 8px 30px rgba(0,200,83,.15);
}

.frame-preview {
  width: 100%;
  aspect-ratio: 1 / 3;
  border-radius: 12px;
  background: #fff;
  overflow: hidden;
  position: relative;
}

.frame-preview img {
  width: 100%;
  height: 100%;
  object-fit: contain;
  display: block;
}

.frame-name {
  margin: 10px 4px 4px;
  font-size: 18px;
  font-weight: 800;
  text-align: center;
}

.frame-error {
  height: 100%;
  display: flex;
  align-items: center;
  justify-content: center;
  text-align: center;
  color: var(--red);
  font-weight: 800;
  padding: 15px;
}

/* FINAL */

#finalCanvas {
  width: min(88vw, 420px);
  height: auto;
  background: white;
  border-radius: 12px;
  box-shadow: 0 10px 40px rgba(0,0,0,.5);
}

.status {
  min-height: 30px;
  margin-top: 15px;
  font-size: 18px;
  font-weight: 700;
  color: white;
}

.final-buttons {
  display: flex;
  flex-wrap: wrap;
  justify-content: center;
}

.loading {
  padding: 25px;
  font-size: 20px;
  color: #bbb;
}

@media (max-width: 700px) {

  .frame-grid {
    grid-template-columns: repeat(2, 1fr);
  }

}

@media (max-width: 450px) {

  .frame-grid {
    grid-template-columns: 1fr;
    width: min(90vw, 330px);
  }

  button {
    width: min(90vw, 360px);
  }

}
</style>
</head>

<body>

<!-- =========================
     HOME
========================= -->

<section id="home" class="screen">

  <div class="logo">📸</div>

  <h1>J PHOTO BOOTH</h1>

  <p>
    ถ่ายรูป • เลือกกรอบ • พิมพ์รูป
  </p>

  <div class="home-buttons">

    <button class="primary" onclick="startCamera()">
      📸 เริ่มถ่ายรูป
    </button>

  </div>

  <div class="info">
    ระบบ Photo Booth สำหรับ GitHub Pages<br>
    กรอบรูปโหลดจากไฟล์ PNG ใน Repository โดยตรง
  </div>

</section>


<!-- =========================
     CAMERA
========================= -->

<section id="cameraScreen" class="screen hidden">

  <h1>📸 เตรียมตัว</h1>

  <div class="camera-wrap">

    <video
      id="camera"
      autoplay
      playsinline
      muted>
    </video>

  </div>

  <div id="countdown"></div>

  <div id="photoCounter" class="counter">
    รูปที่ 1 / 4
  </div>

</section>


<!-- =========================
     REVIEW
========================= -->

<section id="reviewScreen" class="screen hidden">

  <h1>ตรวจสอบรูป</h1>

  <div id="photoList" class="photo-grid"></div>

  <div class="home-buttons">

    <button class="danger" onclick="restart()">
      🔄 ถ่ายใหม่
    </button>

    <button class="primary" onclick="openFrameSelector()">
      🖼️ เลือกกรอบ
    </button>

  </div>

</section>


<!-- =========================
     FRAME SELECTOR
========================= -->

<section id="frameScreen" class="screen hidden">

  <h1>🖼️ เลือกกรอบรูป</h1>

  <p id="frameStatus">
    กำลังโหลดกรอบ...
  </p>

  <div id="frameList" class="frame-grid"></div>

  <div class="home-buttons">

    <button
      class="dark"
      onclick="showScreen('reviewScreen')">
      ← กลับ
    </button>

    <button
      id="useFrameBtn"
      class="primary"
      onclick="createFinalPhoto()"
      disabled>
      📸 ใช้กรอบนี้
    </button>

  </div>

</section>


<!-- =========================
     FINAL
========================= -->

<section id="finalScreen" class="screen hidden">

  <h1>🎉 รูปของคุณ</h1>

  <canvas id="finalCanvas"></canvas>

  <div class="final-buttons">

    <button class="blue" onclick="printPhoto()">
      🖨️ พิมพ์รูป
    </button>

    <button class="primary" onclick="downloadPhoto()">
      ⬇️ ดาวน์โหลดรูป
    </button>

  </div>

  <p id="status" class="status"></p>

  <button class="dark" onclick="restart()">
    🔄 เริ่มรายการใหม่
  </button>

</section>


<script>

/* =========================================================
   SETTINGS
========================================================= */

const PHOTO_COUNT = 4;

/*
  สำคัญมาก

  กรอบของคุณอยู่ที่ Root ของ GitHub Repository

  photoone/
  ├── index.html
  ├── frame1.png
  ├── frame2.png
  └── frame3.png

  ดังนั้นต้องใช้ ./frame1.png
*/

const FRAME_FILES = [
  "frame1.png",
  "frame2.png",
  "frame3.png"
];

/*
  ขนาดรูปสุดท้าย
  600 x 1800
  = 2 x 6 นิ้ว ที่ 300 DPI
*/

const OUTPUT_WIDTH = 600;
const OUTPUT_HEIGHT = 1800;


/* =========================================================
   VARIABLES
========================================================= */

let video = null;
let stream = null;

let photos = [];
let currentPhoto = 0;

let frames = [];
let selectedFrameIndex = -1;

let finalImage = null;


/* =========================================================
   SCREEN
========================================================= */

function showScreen(id) {

  document
    .querySelectorAll(".screen")
    .forEach(function(el) {
      el.classList.add("hidden");
    });

  const target = document.getElementById(id);

  if (target) {
    target.classList.remove("hidden");
  }

  window.scrollTo(0, 0);
}


/* =========================================================
   CAMERA
========================================================= */

async function startCamera() {

  showScreen("cameraScreen");

  try {

    if (!navigator.mediaDevices ||
        !navigator.mediaDevices.getUserMedia) {

      throw new Error(
        "เบราว์เซอร์นี้ไม่รองรับการเปิดกล้อง"
      );
    }

    stream =
      await navigator.mediaDevices.getUserMedia({

        video: {
          facingMode: "user",
          width: {
            ideal: 1280
          },
          height: {
            ideal: 1920
          }
        },

        audio: false

      });

    video =
      document.getElementById("camera");

    video.srcObject = stream;

    await video.play();

    photos = [];
    currentPhoto = 0;

    setTimeout(function() {
      takePhoto();
    }, 1000);

  }

  catch (error) {

    console.error(error);

    alert(
      "เปิดกล้องไม่ได้\n\n" +
      error.message
    );

    showScreen("home");
  }
}


/* =========================================================
   COUNTDOWN
========================================================= */

function countdown(seconds) {

  return new Promise(function(resolve) {

    let n = seconds;

    const el =
      document.getElementById("countdown");

    el.textContent = n;

    const timer =
      setInterval(function() {

        n--;

        if (n <= 0) {

          clearInterval(timer);

          el.textContent = "";

          resolve();

        } else {

          el.textContent = n;

        }

      }, 1000);

  });
}


/* =========================================================
   TAKE PHOTO
========================================================= */

async function takePhoto() {

  currentPhoto++;

  document
    .getElementById("photoCounter")
    .textContent =
      `รูปที่ ${currentPhoto} / ${PHOTO_COUNT}`;

  await countdown(3);

  if (!video ||
      video.readyState < 2) {

    alert("กล้องยังไม่พร้อม");

    return;
  }

  const canvas =
    document.createElement("canvas");

  canvas.width =
    video.videoWidth || 1280;

  canvas.height =
    video.videoHeight || 1920;

  const ctx =
    canvas.getContext("2d");

  /*
    กลับด้านรูปให้เหมือน Preview
  */

  ctx.translate(canvas.width, 0);
  ctx.scale(-1, 1);

  ctx.drawImage(
    video,
    0,
    0,
    canvas.width,
    canvas.height
  );

  photos.push(
    canvas.toDataURL(
      "image/jpeg",
      0.92
    )
  );

  if (currentPhoto < PHOTO_COUNT) {

    setTimeout(
      takePhoto,
      700
    );

  } else {

    stopCamera();

    showReview();

  }
}


/* =========================================================
   STOP CAMERA
========================================================= */

function stopCamera() {

  if (stream) {

    stream
      .getTracks()
      .forEach(function(track) {

        track.stop();

      });

    stream = null;
  }
}


/* =========================================================
   REVIEW
========================================================= */

function showReview() {

  showScreen("reviewScreen");

  const list =
    document.getElementById("photoList");

  list.innerHTML = "";

  photos.forEach(
    function(photo, index) {

      const img =
        document.createElement("img");

      img.src = photo;

      img.alt =
        "รูป " + (index + 1);

      list.appendChild(img);

    }
  );
}


/* =========================================================
   FRAME SELECTOR
========================================================= */

function openFrameSelector() {

  showScreen("frameScreen");

  loadFrames();
}


/* =========================================================
   LOAD FRAMES FROM GITHUB
========================================================= */

function loadFrames() {

  const list =
    document.getElementById("frameList");

  const status =
    document.getElementById("frameStatus");

  const btn =
    document.getElementById("useFrameBtn");

  list.innerHTML = "";

  btn.disabled = true;

  selectedFrameIndex = -1;

  status.textContent =
    "กำลังโหลดกรอบ...";

  frames = [];

  /*
    สร้างรายการกรอบจาก GitHub
  */

  FRAME_FILES.forEach(
    function(fileName, index) {

      const card =
        document.createElement("div");

      card.className =
        "frame-card";

      const preview =
        document.createElement("div");

      preview.className =
        "frame-preview";

      const img =
        document.createElement("img");

      /*
        จุดสำคัญที่สุดของการแก้ครั้งนี้

        ใช้ ./frame1.png
        ไม่ใช่ frames/frame1.png
      */

      const imageUrl =
        "./" +
        fileName +
        "?v=" +
        Date.now();

      img.src = imageUrl;

      img.alt =
        "กรอบที่ " + (index + 1);

      img.onload =
        function() {

          console.log(
            "โหลดกรอบสำเร็จ:",
            imageUrl
          );

        };

      img.onerror =
        function() {

          console.error(
            "โหลดกรอบไม่ได้:",
            imageUrl
          );

          preview.innerHTML = "";

          const error =
            document.createElement("div");

          error.className =
            "frame-error";

          error.innerHTML =
            "❌ โหลดกรอบไม่ได้<br>" +
            fileName;

          preview.appendChild(error);

        };

      preview.appendChild(img);

      const name =
        document.createElement("div");

      name.className =
        "frame-name";

      name.textContent =
        "กรอบที่ " + (index + 1);

      card.appendChild(preview);
      card.appendChild(name);

      card.onclick =
        function() {

          /*
            เลือกกรอบ
          */

          selectedFrameIndex =
            index;

          document
            .querySelectorAll(".frame-card")
            .forEach(
              function(item) {

                item.classList.remove(
                  "selected"
                );

              }
            );

          card.classList.add(
            "selected"
          );

          btn.disabled = false;

          status.textContent =
            "เลือกกรอบที่ " +
            (index + 1) +
            " แล้ว";

        };

      list.appendChild(card);

      /*
        เก็บข้อมูลกรอบ
      */

      frames.push({

        name: fileName,

        url: imageUrl

      });

    }
  );

  status.textContent =
    "มีกระอบ " +
    FRAME_FILES.length +
    " แบบ";

}


/* =========================================================
   CREATE FINAL PHOTO
========================================================= */

async function createFinalPhoto() {

  if (selectedFrameIndex < 0) {

    alert(
      "กรุณาเลือกกรอบก่อน"
    );

    return;
  }

  if (!photos.length) {

    alert(
      "ไม่พบรูปที่ถ่าย"
    );

    return;
  }

  const canvas =
    document.getElementById(
      "finalCanvas"
    );

  canvas.width =
    OUTPUT_WIDTH;

  canvas.height =
    OUTPUT_HEIGHT;

  const ctx =
    canvas.getContext("2d");

  /*
    พื้นหลัง
  */

  ctx.fillStyle = "#ffffff";

  ctx.fillRect(
    0,
    0,
    OUTPUT_WIDTH,
    OUTPUT_HEIGHT
  );

  /*
    ตำแหน่งรูป 4 รูป
  */

  const marginX = 42;

  const top = 45;

  const gap = 18;

  const bottomArea = 150;

  const photoW =
    OUTPUT_WIDTH -
    marginX * 2;

  const availableH =
    OUTPUT_HEIGHT -
    top -
    bottomArea -
    gap * (PHOTO_COUNT - 1);

  const photoH =
    Math.floor(
      availableH / PHOTO_COUNT
    );

  try {

    /*
      โหลดรูปทั้งหมด
    */

    const images =
      await Promise.all(
        photos.map(
          loadImage
        )
      );

    /*
      วาดรูป
    */

    images.forEach(
      function(img, index) {

        const y =
          top +
          index *
          (photoH + gap);

        drawCover(
          ctx,
          img,
          marginX,
          y,
          photoW,
          photoH
        );

      }
    );

    /*
      โหลดกรอบ
    */

    const frame =
      await loadImage(
        frames[selectedFrameIndex].url
      );

    /*
      วางกรอบทับด้านบน
    */

    ctx.drawImage(
      frame,
      0,
      0,
      OUTPUT_WIDTH,
      OUTPUT_HEIGHT
    );

    /*
      สร้าง JPEG
    */

    finalImage =
      canvas.toDataURL(
        "image/jpeg",
        0.95
      );

    showScreen(
      "finalScreen"
    );

    document
      .getElementById("status")
      .textContent =
        "สร้างรูปเรียบร้อยแล้ว";

  }

  catch (error) {

    console.error(error);

    alert(
      "สร้างรูปไม่สำเร็จ\n\n" +
      error.message
    );

  }

}


/* =========================================================
   LOAD IMAGE
========================================================= */

function loadImage(src) {

  return new Promise(
    function(resolve, reject) {

      const img =
        new Image();

      img.onload =
        function() {

          resolve(img);

        };

      img.onerror =
        function() {

          reject(
            new Error(
              "ไม่สามารถโหลดรูป: " +
              src
            )
          );

        };

      img.src = src;

    }
  );
}


/* =========================================================
   DRAW COVER
========================================================= */

function drawCover(
  ctx,
  img,
  x,
  y,
  w,
  h
) {

  const scale =
    Math.max(
      w / img.width,
      h / img.height
    );

  const dw =
    img.width * scale;

  const dh =
    img.height * scale;

  const dx =
    x + (w - dw) / 2;

  const dy =
    y + (h - dh) / 2;

  ctx.save();

  ctx.beginPath();

  ctx.rect(
    x,
    y,
    w,
    h
  );

  ctx.clip();

  ctx.drawImage(
    img,
    dx,
    dy,
    dw,
    dh
  );

  ctx.restore();

}


/* =========================================================
   DOWNLOAD
========================================================= */

function downloadPhoto() {

  if (!finalImage) {

    alert(
      "ยังไม่มีรูป"
    );

    return;
  }

  const link =
    document.createElement("a");

  link.href =
    finalImage;

  link.download =
    "J-PHOTO-" +
    Date.now() +
    ".jpg";

  document.body.appendChild(link);

  link.click();

  document.body.removeChild(link);

}


/* =========================================================
   PRINT
========================================================= */

function printPhoto() {

  if (!finalImage) {

    alert(
      "ยังไม่มีรูปสำหรับพิมพ์"
    );

    return;
  }

  const win =
    window.open(
      "",
      "_blank"
    );

  if (!win) {

    alert(
      "เบราว์เซอร์บล็อก Pop-up\n" +
      "กรุณาอนุญาต Pop-up"
    );

    return;
  }

  win.document.open();

  win.document.write(`

<!doctype html>

<html>

<head>

<meta name="viewport"
      content="width=device-width,initial-scale=1">

<title>J PHOTO BOOTH</title>

<style>

@page {
  size: 2in 6in;
  margin: 0;
}

html,
body {

  margin: 0;
  padding: 0;

  width: 2in;
  height: 6in;

  background: white;

}

img {

  display: block;

  width: 2in;
  height: 6in;

}

</style>

</head>

<body>

<img src="${finalImage}">

<script>

window.onload = function() {

  setTimeout(
    function() {
      window.print();
    },
    500
  );

};

<\/script>

</body>

</html>

`);

  win.document.close();

}


/* =========================================================
   RESTART
========================================================= */

function restart() {

  stopCamera();

  photos = [];

  currentPhoto = 0;

  frames = [];

  selectedFrameIndex = -1;

  finalImage = null;

  document
    .getElementById("photoList")
    .innerHTML = "";

  document
    .getElementById("frameList")
    .innerHTML = "";

  document
    .getElementById("status")
    .textContent = "";

  showScreen(
    "home"
  );

}


/* =========================================================
   PREVENT GESTURE ZOOM
========================================================= */

document.addEventListener(
  "gesturestart",
  function(e) {

    e.preventDefault();

  }
);

</script>

</body>
</html>
