<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
  <meta name="theme-color" content="#111111">

  <title>J PHOTO BOOTH</title>

  <style>
    :root {
      --bg: #101010;
      --panel: #1d1d1d;
      --text: #ffffff;
      --muted: #aaa;
      --primary: #00c853;
      --blue: #2196f3;
      --danger: #ff5252;
      --gold: #ffd54f;
    }

    * {
      box-sizing: border-box;
    }

    html,
    body {
      margin: 0;
      padding: 0;
      width: 100%;
      min-height: 100%;
      background: var(--bg);
      color: var(--text);
      font-family:
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        sans-serif;
    }

    body {
      overflow-x: hidden;
    }

    .screen {
      min-height: 100svh;
      padding: 24px 16px 40px;
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    .hidden {
      display: none !important;
    }

    h1 {
      font-size: clamp(28px, 6vw, 44px);
      margin: 12px 0;
      text-align: center;
    }

    p {
      color: var(--muted);
      font-size: 18px;
      text-align: center;
    }

    button {
      border: 0;
      border-radius: 18px;
      padding: 16px 26px;
      margin: 8px;
      min-height: 56px;
      font-size: 19px;
      font-weight: 800;
      cursor: pointer;
      touch-action: manipulation;
    }

    button:disabled {
      opacity: 0.45;
      cursor: not-allowed;
    }

    .primary {
      background: var(--primary);
      color: white;
    }

    .blue {
      background: var(--blue);
      color: white;
    }

    .danger {
      background: var(--danger);
      color: white;
    }

    .dark {
      background: #333;
      color: white;
    }

    .gold {
      background: var(--gold);
      color: #111;
    }

    .button-row {
      display: flex;
      justify-content: center;
      flex-wrap: wrap;
      gap: 4px;
      margin-top: 12px;
    }

    .logo {
      font-size: 72px;
      margin-top: 7vh;
    }

    .status {
      min-height: 28px;
      max-width: 90vw;
      color: white;
      font-weight: 700;
      text-align: center;
    }

    .hint {
      width: min(92vw, 800px);
      background: #191919;
      border: 1px solid #333;
      padding: 12px 16px;
      border-radius: 14px;
      margin-top: 18px;
      color: #aaa;
      font-size: 14px;
      text-align: center;
      line-height: 1.6;
    }

    /* =========================
       FRAME SELECTOR
    ========================= */

    .frame-grid {
      width: min(96vw, 900px);
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 14px;
      margin-top: 10px;
    }

    .frame-card {
      background: var(--panel);
      border: 4px solid transparent;
      border-radius: 18px;
      padding: 8px;
      cursor: pointer;
      transition: 0.15s ease;
    }

    .frame-card.selected {
      border-color: var(--primary);
      box-shadow: 0 0 0 2px rgba(0, 200, 83, 0.22);
      transform: translateY(-2px);
    }

    .frame-card img {
      display: block;
      width: 100%;
      aspect-ratio: 1 / 3;
      object-fit: contain;
      background: white;
      border-radius: 10px;
    }

    .frame-name {
      margin: 8px 4px 2px;
      font-weight: 700;
      text-align: center;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    /* =========================
       CAMERA
    ========================= */

    .camera-wrap {
      position: relative;
      width: min(94vw, 850px);
      margin-top: 8px;
    }

    #camera {
      display: block;
      width: 100%;
      max-height: 70svh;
      object-fit: cover;
      border-radius: 24px;
      background: #000;

      /* Mirror preview */
      transform: scaleX(-1);
    }

    #countdown {
      position: fixed;
      inset: 0;

      display: flex;
      align-items: center;
      justify-content: center;

      font-size: clamp(90px, 25vw, 180px);
      font-weight: 900;

      text-shadow: 0 4px 30px #000;

      pointer-events: none;
      z-index: 10;
    }

    .counter {
      font-size: 20px;
      margin: 12px;
      font-weight: 800;
    }

    /* =========================
       REVIEW
    ========================= */

    .photo-grid {
      width: min(94vw, 700px);

      display: grid;
      grid-template-columns: repeat(3, 1fr);

      gap: 10px;
    }

    .photo-grid img {
      width: 100%;
      aspect-ratio: 3 / 4;
      object-fit: cover;
      border-radius: 14px;
      background: white;
    }

    /* =========================
       FINAL
    ========================= */

    #finalCanvas {
      width: min(88vw, 420px);
      height: auto;

      background: white;
      border-radius: 12px;

      box-shadow:
        0 10px 40px rgba(0, 0, 0, 0.4);
    }

    @media (min-width: 700px) {

      .frame-grid {
        grid-template-columns: repeat(3, 1fr);
      }

    }
  </style>
</head>

<body>

  <!-- =====================================================
       HOME
  ====================================================== -->

  <section id="home" class="screen">

    <div class="logo">📸</div>

    <h1>J PHOTO BOOTH</h1>

    <p>
      เลือกกรอบ • ถ่าย 3 ซ็อต • ดาวน์โหลด • พิมพ์
    </p>

    <button
      class="primary"
      onclick="openFrameSelector()"
    >
      เริ่มถ่ายรูป
    </button>

    <div class="hint">
      ระบบนี้ทำงานบน GitHub Pages โดยตรง<br>
      ไม่ต้องใช้ Google Apps Script
    </div>

  </section>


  <!-- =====================================================
       FRAME SELECTOR
  ====================================================== -->

  <section
    id="frameScreen"
    class="screen hidden"
  >

    <h1>🖼️ เลือกกรอบรูป</h1>

    <p>
      เลือกกรอบก่อน แล้วจึงเริ่มถ่ายรูป 3 ซ็อต
    </p>

    <div
      id="frameList"
      class="frame-grid"
    ></div>

    <p
      id="frameStatus"
      class="status"
    >
      กำลังโหลดกรอบ...
    </p>

    <div class="button-row">

      <button
        class="dark"
        onclick="showScreen('home')"
      >
        ย้อนกลับ
      </button>

      <button
        id="useFrameBtn"
        class="primary"
        onclick="startCamera()"
        disabled
      >
        เลือกกรอบนี้ แล้วถ่ายรูป
      </button>

    </div>

  </section>


  <!-- =====================================================
       CAMERA
  ====================================================== -->

  <section
    id="cameraScreen"
    class="screen hidden"
  >

    <h1>📸 เตรียมตัว</h1>

    <div class="camera-wrap">

      <video
        id="camera"
        autoplay
        playsinline
        muted
      ></video>

    </div>

    <div id="countdown"></div>

    <div
      id="photoCounter"
      class="counter"
    >
      รูปที่ 1 / 3
    </div>

  </section>


  <!-- =====================================================
       REVIEW
  ====================================================== -->

  <section
    id="reviewScreen"
    class="screen hidden"
  >

    <h1>ตรวจสอบรูป</h1>

    <p>
      ตรวจสอบรูปทั้ง 3 รูปก่อนสร้างรูปสุดท้าย
    </p>

    <div
      id="photoList"
      class="photo-grid"
    ></div>

    <div class="button-row">

      <button
        class="danger"
        onclick="restart()"
      >
        ถ่ายใหม่
      </button>

      <button
        class="primary"
        onclick="createFinalPhoto()"
      >
        ใช้รูปนี้
      </button>

    </div>

  </section>


  <!-- =====================================================
       FINAL
  ====================================================== -->

  <section
    id="finalScreen"
    class="screen hidden"
  >

    <h1>🎉 รูปของคุณ</h1>

    <canvas
      id="finalCanvas"
    ></canvas>

    <p
      id="finalStatus"
      class="status"
    ></p>

    <div class="button-row">

      <button
        class="blue"
        onclick="downloadPhoto()"
      >
        ⬇️ ดาวน์โหลดรูป
      </button>

      <button
        class="gold"
        onclick="printPhoto()"
      >
        🖨️ พิมพ์รูป
      </button>

    </div>

    <button
      class="dark"
      onclick="restart()"
    >
      เริ่มรายการใหม่
    </button>

  </section>


<script>

  /*
   * ============================================================
   * J PHOTO BOOTH
   * GitHub Pages Version
   * ============================================================
   *
   * ไม่ใช้ Google Apps Script
   * ไม่ใช้ Google Drive
   *
   * โครงสร้าง GitHub:
   *
   * photoone/
   *
   * ├── index.html
   *
   * └── frames/
   *     ├── frame01_pink_bow.png
   *     ├── frame02_classic_film.png
   *     └── frame03_blue_good_vibes.png
   *
   */


  /* ============================================================
     ตั้งค่า
  ============================================================ */

  const PHOTO_COUNT = 3;

  const OUTPUT_WIDTH = 600;

  const OUTPUT_HEIGHT = 1800;


  /*
   * รายการกรอบ
   *
   * ถ้าชื่อไฟล์ของคุณไม่ตรง
   * ให้แก้ตรงนี้
   */

  const FRAME_FILES = [

    {
      name: "Pink Bow",
      file: "frames/frame01_pink_bow.png"
    },

    {
      name: "Classic Film",
      file: "frames/frame02_classic_film.png"
    },

    {
      name: "Good Vibes",
      file: "frames/frame03_blue_good_vibes.png"
    }

  ];


  /* ============================================================
     ตัวแปร
  ============================================================ */

  let selectedFrameIndex = -1;

  let selectedFrameImage = null;

  let video = null;

  let stream = null;

  let photos = [];

  let currentPhoto = 0;

  let finalImage = null;


  /* ============================================================
     เปลี่ยนหน้า
  ============================================================ */

  function showScreen(id) {

    document
      .querySelectorAll(".screen")
      .forEach(function(el) {

        el.classList.add("hidden");

      });


    document
      .getElementById(id)
      .classList.remove("hidden");


    window.scrollTo(0, 0);

  }


  /* ============================================================
     เลือกกรอบ
  ============================================================ */

  function openFrameSelector() {

    showScreen("frameScreen");


    const list =
      document.getElementById("frameList");

    const status =
      document.getElementById("frameStatus");

    const button =
      document.getElementById("useFrameBtn");


    list.innerHTML = "";

    button.disabled = true;

    status.textContent =
      "กำลังโหลดกรอบ...";


    FRAME_FILES.forEach(
      function(frame, index) {

        const card =
          document.createElement("div");


        card.className =
          "frame-card";


        const img =
          document.createElement("img");


        img.src = frame.file;

        img.alt = frame.name;


        /*
         * ถ้าไฟล์กรอบโหลดไม่ได้
         */

        img.onerror =
          function() {

            console.error(
              "โหลดกรอบไม่ได้:",
              frame.file
            );

            card.style.display = "none";

          };


        const name =
          document.createElement("div");


        name.className =
          "frame-name";


        name.textContent =
          frame.name;


        card.appendChild(img);

        card.appendChild(name);


        /*
         * เมื่อกดเลือกกรอบ
         */

        card.onclick =
          function() {

            loadImage(frame.file)

              .then(function(image) {

                selectedFrameIndex =
                  index;

                selectedFrameImage =
                  image;


                document
                  .querySelectorAll(
                    ".frame-card"
                  )
                  .forEach(
                    function(card) {

                      card.classList.remove(
                        "selected"
                      );

                    }
                  );


                card.classList.add(
                  "selected"
                );


                button.disabled =
                  false;


                status.textContent =
                  "เลือก: " +
                  frame.name;

              })

              .catch(function(error) {

                console.error(error);

                alert(
                  "ไม่สามารถโหลดกรอบนี้ได้"
                );

              });

          };


        list.appendChild(card);

      }
    );


    status.textContent =
      "มีกรอบ " +
      FRAME_FILES.length +
      " แบบ";

  }


  /* ============================================================
     เปิดกล้อง
  ============================================================ */

  async function startCamera() {

    if (
      selectedFrameIndex < 0 ||
      !selectedFrameImage
    ) {

      alert(
        "กรุณาเลือกกรอบก่อน"
      );

      return;

    }


    showScreen(
      "cameraScreen"
    );


    try {

      if (
        !navigator.mediaDevices ||
        !navigator.mediaDevices.getUserMedia
      ) {

        throw new Error(
          "เบราว์เซอร์ไม่รองรับการเปิดกล้อง"
        );

      }


      stream =
        await navigator.mediaDevices.getUserMedia({

          video: {

            facingMode: "user",

            width: {
              ideal: 1280
            },

            height: {
              ideal: 1920
            }

          },

          audio: false

        });


      video =
        document.getElementById(
          "camera"
        );


      video.srcObject =
        stream;


      await video.play();


      photos = [];

      currentPhoto = 0;


      /*
       * เริ่มถ่ายหลังจากเปิดกล้อง
       */

      setTimeout(
        takePhoto,
        1000
      );


    }

    catch (error) {

      console.error(error);


      alert(
        "เปิดกล้องไม่ได้\n\n" +
        error.message +
        "\n\n" +
        "กรุณาอนุญาตให้เว็บไซต์ใช้กล้อง"
      );


      showScreen(
        "frameScreen"
      );

    }

  }


  /* ============================================================
     Countdown
  ============================================================ */

  function countdown(seconds) {

    return new Promise(
      function(resolve) {

        let number =
          seconds;


        const element =
          document.getElementById(
            "countdown"
          );


        element.textContent =
          number;


        const timer =
          setInterval(
            function() {

              number--;


              if (
                number <= 0
              ) {

                clearInterval(
                  timer
                );

                element.textContent =
                  "";

                resolve();

              }

              else {

                element.textContent =
                  number;

              }

            },
            1000
          );

      }
    );

  }


  /* ============================================================
     ถ่ายรูป
  ============================================================ */

  async function takePhoto() {

    currentPhoto++;


    document.getElementById(
      "photoCounter"
    ).textContent =
      "รูปที่ " +
      currentPhoto +
      " / " +
      PHOTO_COUNT;


    /*
     * นับถอยหลัง 3 วินาที
     */

    await countdown(3);


    /*
     * สร้าง canvas
     */

    const canvas =
      document.createElement(
        "canvas"
      );


    canvas.width =
      video.videoWidth ||
      1280;


    canvas.height =
      video.videoHeight ||
      1920;


    const ctx =
      canvas.getContext("2d");


    /*
     * กลับด้านภาพให้เหมือนกล้องหน้า
     */

    ctx.translate(
      canvas.width,
      0
    );


    ctx.scale(
      -1,
      1
    );


    ctx.drawImage(
      video,
      0,
      0,
      canvas.width,
      canvas.height
    );


    /*
     * บันทึกภาพ
     */

    photos.push(
      canvas.toDataURL(
        "image/jpeg",
        0.92
      )
    );


    /*
     * ถ้ายังไม่ครบ 3 รูป
     */

    if (
      currentPhoto <
      PHOTO_COUNT
    ) {

      setTimeout(
        takePhoto,
        900
      );

    }

    else {

      /*
       * ครบ 3 รูปแล้ว
       */

      stopCamera();

      showReview();

    }

  }


  /* ============================================================
     ปิดกล้อง
  ============================================================ */

  function stopCamera() {

    if (stream) {

      stream
        .getTracks()
        .forEach(
          function(track) {

            track.stop();

          }
        );


      stream = null;

    }


    if (video) {

      video.srcObject =
        null;

    }

  }


  /* ============================================================
     ตรวจรูป
  ============================================================ */

  function showReview() {

    showScreen(
      "reviewScreen"
    );


    const list =
      document.getElementById(
        "photoList"
      );


    list.innerHTML = "";


    photos.forEach(
      function(photo, index) {

        const img =
          document.createElement(
            "img"
          );


        img.src =
          photo;


        img.alt =
          "รูปที่ " +
          (index + 1);


        list.appendChild(
          img
        );

      }
    );

  }


  /* ============================================================
     สร้างรูปสุดท้าย
  ============================================================ */

  async function createFinalPhoto() {

    if (
      photos.length !==
      PHOTO_COUNT
    ) {

      alert(
        "ต้องมีรูปครบ 3 รูปก่อน"
      );

      return;

    }


    if (
      !selectedFrameImage
    ) {

      alert(
        "ยังไม่ได้เลือกกรอบ"
      );

      return;

    }


    const canvas =
      document.getElementById(
        "finalCanvas"
      );


    const status =
      document.getElementById(
        "finalStatus"
      );


    status.textContent =
      "กำลังสร้างรูป...";


    try {

      canvas.width =
        OUTPUT_WIDTH;


      canvas.height =
        OUTPUT_HEIGHT;


      const ctx =
        canvas.getContext(
          "2d"
        );


      /*
       * พื้นหลัง
       */

      ctx.fillStyle =
        "#ffffff";


      ctx.fillRect(
        0,
        0,
        canvas.width,
        canvas.height
      );


      /*
       * ========================================================
       * ตำแหน่งรูป 3 รูป
       * ========================================================
       */

      const marginX =
        42;


      const top =
        45;


      const gap =
        18;


      const bottomArea =
        150;


      const photoW =
        canvas.width -
        marginX * 2;


      const availableH =
        canvas.height -
        top -
        bottomArea -
        gap *
          (PHOTO_COUNT - 1);


      const photoH =
        Math.floor(
          availableH /
          PHOTO_COUNT
        );


      /*
       * โหลดรูปทั้ง 3
       */

      const images =
        await Promise.all(

          photos.map(
            function(src) {

              return loadImage(
                src
              );

            }
          )

        );


      /*
       * วางรูป
       */

      images.forEach(
        function(img, index) {

          const y =
            top +
            index *
              (
                photoH +
                gap
              );


          drawCover(
            ctx,
            img,
            marginX,
            y,
            photoW,
            photoH
          );

        }
      );


      /*
       * วางกรอบ PNG ด้านบน
       */

      ctx.drawImage(

        selectedFrameImage,

        0,

        0,

        OUTPUT_WIDTH,

        OUTPUT_HEIGHT

      );


      /*
       * สร้าง JPG
       */

      finalImage =
        canvas.toDataURL(
          "image/jpeg",
          0.95
        );


      status.textContent =
        "✅ สร้างรูปเรียบร้อย";


      showScreen(
        "finalScreen"
      );

    }

    catch (error) {

      console.error(error);


      alert(
        "สร้างรูปไม่สำเร็จ\n\n" +
        error.message
      );


      status.textContent =
        "";

    }

  }


  /* ============================================================
     โหลดรูป
  ============================================================ */

  function loadImage(src) {

    return new Promise(
      function(resolve, reject) {

        const img =
          new Image();


        img.onload =
          function() {

            resolve(img);

          };


        img.onerror =
          function() {

            reject(
              new Error(
                "โหลดรูปไม่ได้: " +
                src
              )
            );

          };


        img.src =
          src;

      }
    );

  }


  /* ============================================================
     วางรูปแบบ Cover
  ============================================================ */

  function drawCover(
    ctx,
    img,
    x,
    y,
    w,
    h
  ) {

    const scale =
      Math.max(
        w / img.width,
        h / img.height
      );


    const dw =
      img.width *
      scale;


    const dh =
      img.height *
      scale;


    const dx =
      x +
      (w - dw) / 2;


    const dy =
      y +
      (h - dh) / 2;


    ctx.save();


    ctx.beginPath();

    ctx.rect(
      x,
      y,
      w,
      h
    );

    ctx.clip();


    ctx.drawImage(
      img,
      dx,
      dy,
      dw,
      dh
    );


    ctx.restore();

  }


  /* ============================================================
     ดาวน์โหลดรูป
  ============================================================ */

  function downloadPhoto() {

    if (!finalImage) {

      alert(
        "ยังไม่มีรูป"
      );

      return;

    }


    const link =
      document.createElement(
        "a"
      );


    link.href =
      finalImage;


    link.download =
      "J-PHOTO-" +
      new Date()
        .toISOString()
        .replace(
          /[:.]/g,
          "-"
        ) +
      ".jpg";


    document.body.appendChild(
      link
    );


    link.click();


    link.remove();

  }


  /* ============================================================
     พิมพ์รูป
  ============================================================ */

  function printPhoto() {

    if (!finalImage) {

      alert(
        "ยังไม่มีรูปสำหรับพิมพ์"
      );

      return;

    }


    const win =
      window.open(
        "",
        "_blank"
      );


    if (!win) {

      alert(
